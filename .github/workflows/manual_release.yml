name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Which service do you want to build?'
        required: true
        type: choice
        options:
          - Backend
          - Frontend
          - Integration

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          pwd
          ls -la github_manual_release/frontend/
          cat github_manual_release/frontend/index.html
      
      - name: Show selected service
        run: echo "Selected service is ${{ inputs.service }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        if: ${{ inputs.service == 'Backend' || inputs.service == 'Integration' }}
        uses: docker/build-push-action@v6
        with:
          context: ./github_manual_release/backend
          file: ./github_manual_release/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:latest
            ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}

      
      - name: Frontend Build
        if: ${{ inputs.service == 'Frontend' || inputs.service == 'Integration' }}
        uses: docker/build-push-action@v6
        with:
          context: ./github_manual_release/frontend
          file: ./github_manual_release/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}

      - name: Integration Build
        if: ${{ inputs.service == 'Integration' }}
        uses: docker/build-push-action@v6
        with:
          context: ./github_manual_release/integration
          file: ./github_manual_release/integration/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/integration:latest
            ${{ secrets.DOCKER_USERNAME }}/integration:${{ github.sha }}


